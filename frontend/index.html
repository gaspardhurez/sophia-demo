<!doctype html>
<!-- Pas de correcteur orthographique (19/11/2026) : les soulignés rouges
     gênaient la prise de notes. Hérité par tous les champs et les notes. -->
<html lang="fr" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sophia</title>
    <script>
      // Applique le thème avant le premier rendu, pour éviter le flash clair.
      // La clé et les valeurs sont celles de next-themes.
      try {
        var t = localStorage.getItem('theme') || 'system'
        if (
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
