[project]
name = "sophia"
version = "0.1.0"
description = "API de Sophia, outil perso de montée en compétence"
readme = "README.md"
authors = [
    { name = "Gaspard Hurez" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=2.3.0",
    "fastapi>=0.139.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.51.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
sophia = "sophia:main"

# La dictée transcrit en local avec mlx-whisper : Apple Silicon seulement, et
# lourd (MLX, torch). Facultatif : `uv sync --extra transcription`. Sans lui,
# la dictée est grisée, le reste de l'app marche.
[project.optional-dependencies]
transcription = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
